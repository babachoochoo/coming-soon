<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <meta name="description" content="Something new is on the way. Check back soon.">
  <style>
    :root {
      --bg: #0f172a;
      --bg-accent: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bg-accent: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0284c7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 30% 20%, var(--bg-accent), var(--bg) 70%);
    }
    main { max-width: 36rem; text-align: center; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 1.5rem 0 1rem;
      font-size: clamp(2.25rem, 8vw, 4rem);
      line-height: 1.1;
    }
    p { margin: 0 auto; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    form { display: flex; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
    input, button { font: inherit; padding: 0.75rem 1rem; border-radius: 0.5rem; }
    input {
      flex: 1 1 14rem;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--text);
    }
    button {
      border: 0;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      cursor: pointer;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Something new is on the way.</h1>
    <p>We're putting the finishing touches on our new website. Leave your email and we'll let you know the moment we launch.</p>
    <!-- Replace the action with your email-service form endpoint (e.g. Formspree, Buttondown) to collect signups. -->
    <form action="#" method="post">
      <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" required>
      <button type="submit">Notify me</button>
    </form>
  </main>
</body>
</html>
